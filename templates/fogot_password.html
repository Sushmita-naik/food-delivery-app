<!DOCTYPE html>
<html>
<head>

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Reset Password</h1>

<form method="POST">

    <input type="email"
           name="email"
           placeholder="Enter Email"
           required>

    <br><br>

    <input type="password"
           name="new_password"
           placeholder="New Password"
           required>

    <br><br>

    <button type="submit">
        Reset Password
    </button>

</form>

<h3>{{ message }}</h3>

</body>
</html>
