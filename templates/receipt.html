<!DOCTYPE html>
<html>

<head>

    <title>Receipt</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Payment Receipt</h1>

<hr>

<h2>Ordered Items</h2>

{% for item in cart %}

<div style="
background:white;
padding:15px;
margin:15px;
border-radius:10px;
">

    <h3>{{ item[2] }}</h3>

    <p>Price: ₹{{ item[3] }}</p>

    <p>Category: {{ item[4] }}</p>

</div>

{% endfor %}

<hr>

<h2>Total Amount: ₹{{ total }}</h2>

<h2>Payment Method: {{ payment_method }}</h2>

<h2>Status: Payment Successful ✅</h2>

<br>

<a href="/dashboard">

    <button>
        Back To Home
    </button>

</a>

</body>
</html>
