<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Create Account</h1>

<form method="POST">

    <input type="text"
           name="name"
           placeholder="Name"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <textarea name="address"
              placeholder="Address"></textarea>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<h3>{{ message }}</h3>

</body>
</html>
